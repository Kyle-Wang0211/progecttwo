[program:object_slam3r_surface_v1_sidecar]
command=/bin/bash /opt/object_slam3r_surface_v1_sidecar/start_sidecar_standby.sh
directory=/opt/object_slam3r_surface_v1_sidecar
user=root
autostart=true
autorestart=true
startsecs=10
startretries=999
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/opt/object_slam3r_surface_v1_sidecar/run.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
environment=PYTHONUNBUFFERED="1",OBJECT_SLAM3R_SURFACE_CLAIM_ENABLED_OVERRIDE="0"
