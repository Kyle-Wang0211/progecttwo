Dataset:
  pcd_downsample: 32
  pcd_downsample_init: 16
  adaptive_pointsize: True
  point_size: 0.05
  scale_multiplier: 2.25

Tracking:
  motion_filter:
    init_thresh: 4.0
    thresh: 2.4
    skip_blur: True
  frontend:
    keyframe_thresh: 4.0
    frontend_thresh: 16.0
    frontend_window: 30
    frontend_radius: 2
    frontend_nms: 1
    mono_depth_alpha: 0.01
  backend:
    backend_thresh: 40.0
    backend_radius: 2
    backend_nms: 1
    covis_thresh: 0.2
  pgba:
    active: True
    pgba_thresh: 22.0

Training:
  init_itr_num: 1600
  init_gaussian_update: 100
  init_gaussian_reset: 700
  init_gaussian_th: 0.004
  init_gaussian_extent: 36
  gaussian_update_every: 100
  gaussian_update_offset: 25
  gaussian_th: 0.55
  gaussian_extent: 1.2
  gaussian_reset: 4001
  size_threshold: 20
  window_size: 20
  rgb_boundary_threshold: 0.01
  lambda_dnormal: 0.5
  compensate_exposure: true

opt_params:
  pose_lr: 0.0001
  position_lr_init: 0.00016
  position_lr_final: 0.0000016
  position_lr_max_steps: 52000
  feature_lr: 0.0025
  opacity_lr: 0.05
  scaling_lr: 0.001
  rotation_lr: 0.001
  exposure_lr: 0.01
  percent_dense: 0.02
  lambda_dssim: 0.2
  densify_grad_threshold: 0.00015
